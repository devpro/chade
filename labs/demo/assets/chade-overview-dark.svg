<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="440" fill="#0f172a"/>

  <!-- The machine -->
  <rect x="20" y="20" width="290" height="400" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="165" y="54" text-anchor="middle" font-size="20" font-weight="600" fill="#e2e8f0">A machine</text>
  <text x="165" y="76" text-anchor="middle" font-size="13" fill="#94a3b8">Linux, WSL or Windows</text>

  <rect x="40" y="96" width="250" height="90" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="56" y="122" font-size="15" font-weight="600" fill="#38bdf8">Configuration files</text>
  <text x="56" y="146" font-size="13" fill="#94a3b8" font-family="Consolas, monospace">~/.gitconfig  ~/.npmrc</text>
  <text x="56" y="168" font-size="13" fill="#94a3b8" font-family="Consolas, monospace">/etc/wsl.conf  settings.json</text>

  <rect x="40" y="200" width="250" height="90" rx="8" fill="#0f172a" stroke="#a78bfa"/>
  <text x="56" y="226" font-size="15" font-weight="600" fill="#a78bfa">Inventories</text>
  <text x="56" y="250" font-size="13" fill="#94a3b8">apt, npm, winget packages</text>
  <text x="56" y="272" font-size="13" fill="#94a3b8">VS Code extensions, services</text>

  <rect x="40" y="304" width="250" height="96" rx="8" fill="#0f172a" stroke="#4ade80"/>
  <text x="56" y="330" font-size="15" font-weight="600" fill="#4ade80">Git repositories</text>
  <text x="56" y="354" font-size="13" fill="#94a3b8">branch, to commit, push, pull</text>
  <text x="56" y="376" font-size="13" fill="#94a3b8">disk and memory they take</text>

  <!-- chade -->
  <rect x="395" y="140" width="210" height="160" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="500" y="180" text-anchor="middle" font-size="24" font-weight="700" fill="#fbbf24">chade</text>
  <text x="500" y="210" text-anchor="middle" font-size="13" fill="#e2e8f0">reads, never changes</text>
  <text x="500" y="230" text-anchor="middle" font-size="13" fill="#e2e8f0">the system</text>
  <text x="500" y="262" text-anchor="middle" font-size="13" fill="#94a3b8">masks secrets</text>
  <text x="500" y="282" text-anchor="middle" font-size="13" fill="#94a3b8">scans with gitleaks</text>

  <line x1="310" y1="160" x2="390" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="245" x2="390" y2="225" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="310" y1="350" x2="390" y2="265" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- The store -->
  <rect x="690" y="20" width="290" height="190" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="835" y="54" text-anchor="middle" font-size="20" font-weight="600" fill="#e2e8f0">The store</text>
  <text x="835" y="76" text-anchor="middle" font-size="13" fill="#94a3b8">a git repository, one folder per machine</text>
  <text x="712" y="108" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace" xml:space="preserve">laptop/linux/files/...</text>
  <text x="712" y="130" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace" xml:space="preserve">laptop/linux/inventories/...</text>
  <text x="712" y="152" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace" xml:space="preserve">desktop/windows/...</text>
  <text x="712" y="186" font-size="13" fill="#94a3b8">a snapshot is one commit</text>

  <line x1="605" y1="185" x2="685" y2="130" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="548" y="120" font-size="13" fill="#fbbf24" font-family="Consolas, monospace">chade snapshot</text>

  <!-- The browser -->
  <rect x="690" y="240" width="290" height="180" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="835" y="274" text-anchor="middle" font-size="20" font-weight="600" fill="#e2e8f0">The browser</text>
  <text x="835" y="296" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Consolas, monospace">http://127.0.0.1:7843</text>
  <text x="712" y="328" font-size="14" fill="#4ade80">Repositories: state and git actions</text>
  <text x="712" y="352" font-size="14" fill="#38bdf8">Store: snapshots and their changes</text>
  <text x="712" y="376" font-size="14" fill="#a78bfa">Report: disk, memory, clean-up</text>
  <text x="712" y="400" font-size="14" fill="#e2e8f0">Docs: the guide of the version</text>

  <line x1="605" y1="260" x2="685" y2="320" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="320" font-size="13" fill="#fbbf24" font-family="Consolas, monospace">chade ui</text>
</svg>
