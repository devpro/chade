title: "chade"
description: >
  Get started with chade: snapshot the configuration of a machine into git,
  see its git repositories in one page and work on them, and measure what takes disk and memory.
duration: 20
tags:
  - git
  - chade
  - demo
sidebarWidth: 620
colorScheme: dark
backend: container
hosts:
  - name: control
  - name: laptop
    runtime: vm
    cores: 2
    memory: 2048
    disk: 4096
    # gives access to chade
    forward:
      - 7843
env:
  NPM_VERSION: 12.2.0  # ref. https://www.npmjs.com/package/npm
  NPM_REGISTRY_URL: https://registry.npmjs.org
  GIT_USER_NAME: Ada Lovelace
  GIT_USER_EMAIL: ada@example.com
  GITLEAKS_VERSION: 8.30.1  # ref. https://github.com/gitleaks/gitleaks/releases
  CHADE_VERSION: 0.1.4  # ref. https://github.com/devpro/chade/pkgs/npm/chade
  COWSAY_VERSION: 1.6.0  # ref. https://www.npmjs.com/package/cowsay
secrets:
  - name: CHADE_NPM_TOKEN
    description: GitHub token with the read:packages scope, for the @devpro packages on GitHub Packages
