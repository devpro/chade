runner:
  image: ghcr.io/devpro/debian-node:latest
  images:
    "markup-lint*": ghcr.io/devpro/debian-node:latest
    # The end to end tests drive Chromium, whose system libraries the job cannot install as an ordinary user.
    "build-test*": ghcr.io/devpro/debian-node-playwright:latest
  docker: ["image-scan*"]
  # The analysis runs against the SonarQube IstarCI starts on this machine, with a token made there.
  sonarqube: true

workflow:
  onDisallowedAction: fail
  allowedActions:
    - actions/*
    - github/*
    - docker/*
    - devpro/github-workflow-parts/*
  exclude:
    - pkg.yaml

vars:
  # The local SonarQube has no organizations, and a non-empty one is what turns the analysis on.
  SONAR_ORG: local
  SONAR_PROJECT_KEY: chade
  CONTAINER_REGISTRY_PATH: devprofr
