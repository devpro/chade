runner:
  image: ghcr.io/devpro/ubuntu-node:latest
  images:
    "markup-lint*": ghcr.io/devpro/ubuntu-node:latest
    "build-test__*": ghcr.io/devpro/ubuntu-node-playwright:latest
  docker: ["image-scan*"]
  sonarqube:
    gate: true

workflow:
  onDisallowedAction: fail
  allowedActions:
    - actions/*
    - github/*
    - docker/*
    - devpro/github-workflow-parts/*
  exclude:
    - pkg.yaml

vars:
  SONAR_ORG: local
  SONAR_PROJECT_KEY: chade
