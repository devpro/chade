# Read by the Sonar scan from the root of the repository, which the project key and the organization are given to by the pipeline.
sonar.sources=packages/cli/src
sonar.tests=packages/cli/test
sonar.test.inclusions=packages/cli/test/**/*.test.ts
sonar.exclusions=**/dist/**,**/node_modules/**
# The test:coverage script of the root writes this report with paths from the root, which is where the scan resolves them.
sonar.javascript.lcov.reportPaths=packages/cli/coverage/lcov.info
