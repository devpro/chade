sonar.sources=packages/cli/src,packages/daemon/src,packages/ui/src
sonar.tests=packages/cli/test,packages/daemon/test,packages/ui/test,packages/ui/e2e
sonar.test.inclusions=packages/*/test/**/*.test.ts,packages/ui/e2e/**/*.ts
sonar.exclusions=**/dist/**,**/node_modules/**
sonar.javascript.lcov.reportPaths=packages/cli/coverage/lcov.info
sonar.coverage.exclusions=packages/cli/src/bin.ts,packages/ui/src/api.ts,packages/ui/src/docs.ts,packages/ui/src/dom.ts,packages/ui/src/files.ts,\
  packages/ui/src/forge.ts,packages/ui/src/list.ts,packages/ui/src/main.ts,packages/ui/src/markdown.ts,packages/ui/src/report.ts,\
  packages/ui/src/repository.ts,packages/ui/src/store.ts

sonar.issue.ignore.multicriteria=sort,inline,inlineRuntime
# inventories are sorted by code point, the same order on every machine, where localeCompare would follow the locale of each
sonar.issue.ignore.multicriteria.sort.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.sort.resourceKey=packages/cli/src/inventories.ts
# pattern of the inline Markdown reads the documents bundled with chade, one line at a time, never text from elsewhere
sonar.issue.ignore.multicriteria.inline.ruleKey=typescript:S5843
sonar.issue.ignore.multicriteria.inline.resourceKey=packages/ui/src/markdown.ts
sonar.issue.ignore.multicriteria.inlineRuntime.ruleKey=typescript:S8786
sonar.issue.ignore.multicriteria.inlineRuntime.resourceKey=packages/ui/src/markdown.ts
