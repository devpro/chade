<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>chade</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <h1>chade</h1>
      <span id="machine"></span>
      <span id="version"></span>
    </header>
    <main>
      <div class="bar">
        <nav id="tabs" role="tablist" aria-label="Systems of the machine"></nav>
        <span id="scanned"></span>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <div class="bar">
        <input id="filter" type="search" placeholder="Filter by name, path or branch" aria-label="Filter the repositories" />
        <label><input id="attention" type="checkbox" /> Only those with something to do</label>
        <span id="summary"></span>
      </div>
      <ul id="warnings"></ul>
      <div id="content"></div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
