name: CI
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Integration pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@398cf79719f90e41e3407bc9f060e297629d800d

  git-check:
    name: Git
    uses: devpro/github-workflow-parts/.github/workflows/reusable-git-check.yml@398cf79719f90e41e3407bc9f060e297629d800d
    with:
      paths: ". :(exclude)*.md :(exclude)docs"
      workflow-parts-version: 398cf79719f90e41e3407bc9f060e297629d800d

  build-test:
    name: Build & Test
    needs: git-check
    if: needs.git-check.outputs.changed == 'true'
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@398cf79719f90e41e3407bc9f060e297629d800d
    with:
      custom-tests: npm run test:pkg && npm run ui:screenshots && mkdir -p report && cp -r packages/ui/e2e/screenshots report/
      job-name: Build & Test
      sonar-enabled: true
      sonar-host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      sonar-organization: ${{ vars.SONAR_ORG }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      sonar-project-name: Chade
      test-script: test:coverage
      workflow-parts-version: 398cf79719f90e41e3407bc9f060e297629d800d
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  build-test-windows:
    name: Build & Test (Windows)
    needs: git-check
    if: needs.git-check.outputs.changed == 'true'
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@398cf79719f90e41e3407bc9f060e297629d800d
    with:
      custom-tests: npm run test:pkg
      extra-vars: |
        npm_config_script_shell=C:\Program Files\Git\bin\bash.exe
        GIT_CONFIG_COUNT=1
        GIT_CONFIG_KEY_0=core.autocrlf
        GIT_CONFIG_VALUE_0=false
      job-name: Build & Test (Windows)
      operating-system: windows-latest
      test-script: test:unit
      workflow-parts-version: 398cf79719f90e41e3407bc9f060e297629d800d
