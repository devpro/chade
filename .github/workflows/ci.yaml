name: CI
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Integration pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e

  # A change to the documentation alone needs the markup checked, not the build and the tests.
  git-check:
    name: Git
    uses: devpro/github-workflow-parts/.github/workflows/reusable-git-check.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      paths: ". :(exclude)*.md :(exclude)docs"
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e

  build-test:
    name: Build & Test
    needs: git-check
    if: needs.git-check.outputs.changed == 'true'
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      custom-tests: npm run test:pkg
      job-name: Build & Test
      sonar-enabled: true
      sonar-host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      sonar-organization: ${{ vars.SONAR_ORG }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      sonar-project-name: Chade
      # The unit tests, with the lcov report the Sonar analysis reads.
      test-script: test:coverage
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  # chade also runs on Windows itself, where the tests of a Linux host are skipped and the smoke test runs with a windows section.
  build-test-windows:
    name: Build & Test (Windows)
    needs: git-check
    if: needs.git-check.outputs.changed == 'true'
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      custom-tests: npm run test:pkg
      # npm runs the scripts with cmd.exe on Windows, and they are bash scripts.
      # The runner image sets core.autocrlf, which would check out the scripts with CRLF, and the git environment overrides it before the checkout.
      extra-vars: |
        npm_config_script_shell=C:\Program Files\Git\bin\bash.exe
        GIT_CONFIG_COUNT=1
        GIT_CONFIG_KEY_0=core.autocrlf
        GIT_CONFIG_VALUE_0=false
      job-name: Build & Test (Windows)
      operating-system: windows-latest
      test-script: test:unit
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
