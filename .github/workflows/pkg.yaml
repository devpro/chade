name: PKG
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Delivery (aka Packaging & Shipping)
# description: publishes the CLI to npmjs.org (chade).

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-pkg"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm-publication:
    name: "Package chade"
    permissions:
      contents: read
      # npm trusted publishing: the package is published with a short-lived OIDC token rather than a stored secret.
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-npm-publication.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
      # prepack builds the package.
      build-command: ""
      working-directory: packages/cli
