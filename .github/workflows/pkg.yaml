name: PKG
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# purpose: Continuous Delivery (aka Packaging & Shipping)
# description: publishes the CLI to GitHub Packages (@devpro/chade).

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-pkg"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm-publication:
    name: "Package chade"
    permissions:
      contents: read
      packages: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-npm-publication.yml@398cf79719f90e41e3407bc9f060e297629d800d
    with:
      workflow-parts-version: 398cf79719f90e41e3407bc9f060e297629d800d
      # prepack builds the package.
      build-command: ""
      registry-url: https://npm.pkg.github.com
      scope: "@devpro"
      working-directory: packages/cli
