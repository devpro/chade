version: '3'

# Every workflow of CONTRIBUTING.md as a single command, `task` alone lists them.
# Arguments for the CLI come after --, for example: task run -- snapshot --dry-run

vars:
  # The demo lab is checked by the sidelab checkout beside this repository, so the checks are those of the launcher that runs it.
  SIDELAB_DIR: '{{.SIDELAB_DIR | default (print .ROOT_DIR "/../sidelab")}}'

tasks:

  default:
    cmds:
      - task --list

  # ── Setup ───────────────────────────────────────────────────────────────────

  install:
    desc: Install the npm workspaces
    cmds:
      - npm install

  # ── Build ───────────────────────────────────────────────────────────────────

  build:
    desc: Typecheck and bundle the CLI into packages/cli/dist, and the web interface into its ui folder
    cmds:
      - npm run build

  run:
    desc: "Run the CLI from its sources, arguments after --, for example: task run -- snapshot --dry-run"
    cmds:
      - npm run dev --workspace=packages/cli -- {{.CLI_ARGS}}

  reload:
    desc: Build, then restart the server of the web interface and open it, to see a change
    cmds:
      - task: build
      - npm run dev --workspace=packages/cli -- daemon stop
      - npm run dev --workspace=packages/cli -- ui {{.CLI_ARGS}}

  link:
    desc: Put the chade command of this working tree on the PATH, from a fresh build
    deps: [build]
    cmds:
      - npm link --workspace=packages/cli

  # ── Tests ───────────────────────────────────────────────────────────────────

  typecheck:
    desc: Typecheck the sources and the tests of every package, which tsx runs without checking
    cmds:
      - npm run typecheck

  test:
    desc: Unit tests of every package, which need git and nothing else, and never reach Windows
    aliases: [test:unit]
    cmds:
      - npm run test:unit

  test:coverage:
    desc: Unit tests with a coverage report in the terminal and in packages/cli/coverage/lcov.info
    cmds:
      - npm run test:coverage

  test:e2e:
    desc: Web interface end to end tests in Chromium, against the built server and repositories made for the run
    cmds:
      - npm run test:e2e

  ui:screenshots:
    desc: Runs the end to end tests on the two target screens and in the dark theme, and saves a screenshot of each state in packages/ui/e2e/screenshots
    cmds:
      - npm run ui:screenshots

  test:pkg:
    desc: Packaging smoke test, packs the tarball and installs it into an empty project the way a first install would
    cmds:
      - npm run test:pkg

  check:
    desc: What CI runs, typecheck, build, unit tests, packaging smoke test and end to end tests
    cmds:
      - task: typecheck
      - task: build
      - task: test
      - task: test:pkg
      - task: test:e2e

  sonar:
    desc: Fail when the local Sonar analysis of the commit checked out has an open finding, old or new, after its IstarCI run
    cmds:
      - scripts/check_sonar_findings.sh

  # ── Publication ─────────────────────────────────────────────────────────────

  # pkg.yaml publishes on a push to main only when the version of packages/cli is not on the registry yet, so a change meant for release bumps first.
  dev:bump:
    desc: Bump chade to the next patch version in packages/cli/package.json and package-lock.json
    cmds:
      - npm version patch --no-git-tag-version --workspace=packages/cli

  # ── Demo lab ────────────────────────────────────────────────────────────────

  lab:lint:
    desc: Check the demo lab without a launcher
    dir: '{{.SIDELAB_DIR}}'
    cmds:
      - npm run --silent build:course-kit
      - ./node_modules/.bin/tsx packages/cli/src/bin.ts course lint "{{.ROOT_DIR}}/labs/demo"

  # A required secret lives in the database of a launcher, so a run that needs one goes to the launcher already holding it, named by LAUNCHER_URL,
  # and without it to a disposable launcher, which refuses the lab until the secret is entered there.
  lab:verify:
    desc: 'Run the blocks of the demo lab, against the launcher of LAUNCHER_URL or a disposable one: task lab:verify [STEPS=1-3] [KEEP=1] [-- --show-output]'
    cmds:
      - task: lab:run
        vars: { COMMAND: verify:course, ARGS: '--steps {{.STEPS | default "all"}} {{.CLI_ARGS}}' }

  lab:record:
    desc: 'Record the demo lab as a WebM, against the launcher of LAUNCHER_URL or a disposable one: task lab:record OUT=<absolute path>.webm [KEEP=1]'
    requires:
      vars: [OUT]
    cmds:
      - task: lab:run
        vars: { COMMAND: record:course, ARGS: '--out {{.OUT}} {{.CLI_ARGS}}' }

  lab:run:
    internal: true
    cmds:
      - |
        if [ -n "${LAUNCHER_URL:-}" ]; then
          cd "{{.SIDELAB_DIR}}" && \
          ADMIN_USERNAME="${ADMIN_USERNAME:-admin}" ADMIN_PASSWORD="${ADMIN_PASSWORD:-verify-course-local-pass}" \
          npm run --silent {{.COMMAND}} -- "{{.ROOT_DIR}}/labs/demo" --capabilities network {{.ARGS}}
        else
          task -d "{{.SIDELAB_DIR}}" {{.COMMAND}} COURSE="{{.ROOT_DIR}}/labs/demo" KEEP={{.KEEP | default "0"}} CLI_ARGS="--capabilities network {{.ARGS}}"
        fi

  lab:stop:
    desc: Stop the disposable launchers a lab:verify or lab:record run left behind (KEEP=1, or a run killed before its cleanup)
    cmds:
      - task -d "{{.SIDELAB_DIR}}" verify:course:stop
