version: '3'

# Every workflow of CONTRIBUTING.md as a single command, `task` alone lists them.
# Arguments for the CLI come after --, for example: task run -- snapshot --dry-run

tasks:

  default:
    cmds:
      - task --list

  # ── Setup ───────────────────────────────────────────────────────────────────

  install:
    desc: Install the npm workspaces
    cmds:
      - npm install

  # ── Build ───────────────────────────────────────────────────────────────────

  build:
    desc: Typecheck and bundle the CLI into packages/cli/dist
    cmds:
      - npm run build

  run:
    desc: "Run the CLI from its sources, arguments after --, for example: task run -- snapshot --dry-run"
    cmds:
      - npm run dev --workspace=packages/cli -- {{.CLI_ARGS}}

  link:
    desc: Put the chade command of this working tree on the PATH, from a fresh build
    deps: [build]
    cmds:
      - npm link --workspace=packages/cli

  # ── Tests ───────────────────────────────────────────────────────────────────

  typecheck:
    desc: Typecheck the sources and the tests, which tsx runs without checking
    cmds:
      - npm run typecheck

  test:
    desc: Unit tests, which need git and nothing else, and never reach Windows
    aliases: [test:unit]
    cmds:
      - npm run test:unit

  test:coverage:
    desc: Unit tests with a coverage report in the terminal and in packages/cli/coverage/lcov.info
    cmds:
      - npm run test:coverage

  test:pkg:
    desc: Packaging smoke test, packs the tarball and installs it into an empty project the way a first install would
    cmds:
      - npm run test:pkg

  check:
    desc: What CI runs, typecheck, build, unit tests and packaging smoke test
    cmds:
      - task: typecheck
      - task: build
      - task: test
      - task: test:pkg
